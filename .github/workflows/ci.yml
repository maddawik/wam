name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v5
      - run: mise run lint
      - run: mise run test
      # The race detector needs cgo; run it where a C toolchain is a given.
      - if: runner.os != 'Windows'
        run: mise run test:race
      - run: mise run build

  # Build every release archive so the GoReleaser config can't rot.
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v5
      - run: mise run release:snapshot
